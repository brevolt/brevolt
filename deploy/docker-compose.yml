# Usage: cp deploy/.env.example deploy/.env, fill the three secrets, then
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
name: brevolt

x-hardening: &hardening
  read_only: true
  user: '1000:1000'
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  tmpfs: ['/tmp']
  restart: unless-stopped

services:
  server:
    <<: *hardening
    image: ghcr.io/brevolt/brevolt:${BREVOLT_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in deploy/.env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in deploy/.env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in deploy/.env}
      PUBLIC_URL: ${PUBLIC_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:${BREVOLT_PORT:-3000}:3000'
    volumes:
      - brevolt-data:/data

  # Daily VACUUM INTO copy on a separate volume; keeps 30 days by default.
  backup:
    <<: *hardening
    image: ghcr.io/brevolt/brevolt:${BREVOLT_VERSION:-latest}
    command: ['node', 'dist/backup-cli.js']
    # The image healthcheck probes the HTTP server, which this container does not run.
    healthcheck:
      disable: true
    depends_on:
      server:
        condition: service_healthy
    environment:
      DATABASE_PATH: /data/brevolt.db
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - brevolt-data:/data
      - brevolt-backups:/backups

volumes:
  brevolt-data:
  brevolt-backups:
