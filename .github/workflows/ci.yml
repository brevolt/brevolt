name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the full history; any finding fails the job.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git --redact --verbose --config /repo/.gitleaks.toml /repo

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on high or critical. Documented exceptions go in package.json (pnpm.auditConfig.ignoreCves).
      - run: pnpm audit --prod --audit-level high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/Dockerfile -t brevolt:ci .
      # Fails on critical vulnerabilities (R-SEC-14).
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: brevolt:ci
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Compose smoke test
        working-directory: deploy
        env:
          BREVOLT_VERSION: ci
        run: |
          cat > .env <<ENV
          ENCRYPTION_KEY=$(openssl rand -base64 32)
          GOOGLE_CLIENT_ID=ci-placeholder
          GOOGLE_CLIENT_SECRET=ci-placeholder
          ENV
          docker tag brevolt:ci ghcr.io/${GITHUB_REPOSITORY}:ci
          trap 'docker compose logs; docker compose down -v' EXIT
          BREVOLT_VERSION=ci docker compose up -d --no-build --wait --wait-timeout 90
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/healthz
          docker compose exec -T server sh -c 'touch /app/x' && exit 1 || echo "root fs is read-only"
