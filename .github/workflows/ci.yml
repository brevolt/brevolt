name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on `main`: it may be publishing the image or deploying production.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @brevolt/dashboard exec playwright install --with-deps chromium
      # Real server and built dashboard against a temporary database (see apps/dashboard/e2e).
      - run: pnpm --filter @brevolt/dashboard test:e2e

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the full history; any finding fails the job.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git --redact --verbose --config /repo/.gitleaks.toml /repo

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on high or critical. Documented exceptions go in package.json (pnpm.auditConfig.ignoreCves).
      - run: pnpm audit --prod --audit-level high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/Dockerfile -t brevolt:ci .
      # Fails on critical vulnerabilities (R-SEC-14).
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: brevolt:ci
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Compose smoke test
        working-directory: deploy
        env:
          BREVOLT_VERSION: ci
        run: |
          cat > .env <<ENV
          ENCRYPTION_KEY=$(openssl rand -base64 32)
          GOOGLE_CLIENT_ID=ci-placeholder
          GOOGLE_CLIENT_SECRET=ci-placeholder
          ENV
          docker tag brevolt:ci ghcr.io/${GITHUB_REPOSITORY}:ci
          trap 'docker compose logs; docker compose down -v' EXIT
          BREVOLT_VERSION=ci docker compose up -d --no-build --wait --wait-timeout 90
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/healthz
          docker compose exec -T server sh -c 'touch /home/node/x' && exit 1 || echo "root fs is read-only"

          # Restore drill: write a marker, back up, destroy it, restore, verify.
          q() { docker compose exec -T server node -e "const D=require('better-sqlite3');const d=new D('/data/brevolt.db');$1;d.close()"; }
          q "d.exec('CREATE TABLE drill(v TEXT);INSERT INTO drill VALUES (\\'kept\\')')"
          docker compose run --rm --no-deps backup node dist/backup-cli.js --once
          q "d.exec('DROP TABLE drill')"
          docker compose stop server backup
          docker compose run --rm --no-deps --entrypoint sh backup -c \
            'rm -f /data/brevolt.db-wal /data/brevolt.db-shm; cp "$(ls /backups/brevolt-*.db | sort | tail -n1)" /data/brevolt.db'
          docker compose up -d --no-build --wait --wait-timeout 90
          q "console.log(d.prepare('SELECT v FROM drill').get().v)" | grep -x kept

  # Every green push to `main` deploys production: Dokploy pulls `main` and builds deploy/Dockerfile.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, e2e, secrets, audit, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "::error::DOKPLOY_DEPLOY_WEBHOOK secret is not set; production was not deployed"
            exit 1
          fi
          curl -fsS --retry 3 -X POST "$DOKPLOY_DEPLOY_WEBHOOK" -o /dev/null
