name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # attach the SBOM to the release
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BREVOLT_VERSION=${{ steps.meta.outputs.version }}
          provenance: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: true
      - name: Attest SBOM
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json \
            "${IMAGE}@${{ steps.build.outputs.digest }}"
